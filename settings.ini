[general]
language = English
theme = Light

[editor]
font_family = Consolas
font_size = 10
auto_complete = True
word_wrap = True
tab_size = 4
use_spaces = True
highlight_current_line = True
show_line_numbers = True

[data]
max_rows = 1000
null_display = NULL
auto_commit = False
batch_size = 1000

[connection]
history_size = 10
save_passwords = False

[logging]
level = INFO
file_enabled = True
console_enabled = True

